[versions]

# Java
java = "17"

#
# Dependencies
#

# Checker Framework
# Latest version -> https://mvnrepository.com/artifact/org.checkerframework/checker-qual
checker-qual = "4.3.0"

# Apache Commons
# Latest version -> https://mvnrepository.com/artifact/commons-cli/commons-cli
commons-cli = "1.11.0"
# Latest version -> https://mvnrepository.com/artifact/commons-io/commons-io
commons-io = "2.22.0"

# Spring Boot
# Its BOM is only used by jodconverter-spring-boot-starter
# Latest version -> https://mvnrepository.com/artifact/org.springframework.boot/spring-boot
spring-boot = "3.5.16"

# Spring Framework, used by jodconverter-spring and jodconverter-cli
# Stay on the version line used by the Spring Boot version above
# Latest version -> https://mvnrepository.com/artifact/org.springframework/spring-core
spring = "6.2.19"

# SLF4J
# Latest version -> https://mvnrepository.com/artifact/org.slf4j/slf4j-api
slf4j = "1.7.36"

# Gson
# Latest version -> https://mvnrepository.com/artifact/com.google.code.gson/gson
gson = "2.9.1"

# Apache HttpComponents
# Latest version -> https://mvnrepository.com/artifact/org.apache.httpcomponents/httpclient
httpclient = "4.5.14"
# Latest version -> https://mvnrepository.com/artifact/org.apache.httpcomponents/httpcore
httpcore = "4.4.16"
# Used by httpclient, which requests an older version
# Latest version -> https://mvnrepository.com/artifact/commons-codec/commons-codec
commons-codec = "1.15"

# LibreOffice
# Latest version -> https://mvnrepository.com/artifact/org.libreoffice
lo = "26.2.2"

# OpenOffice
# Latest version -> https://mvnrepository.com/artifact/org.openoffice
oo = "4.1.2"

#
# Testing
#

# JUnit (BOM)
# Latest version -> https://mvnrepository.com/artifact/org.junit/junit-bom
# Same version as the Spring Boot version above (Spring 6 requires JUnit 5.9+)
junit = "5.12.2"

# Latest version -> https://mvnrepository.com/artifact/org.assertj/assertj-core
assertj = "3.22.0"

# Latest version -> https://mvnrepository.com/artifact/org.mockito/mockito-core
mockito = "4.5.1"

# We now have to use the wiremock standalone version since
# spring boot provides jetty dependency
# Latest version -> https://mvnrepository.com/artifact/org.wiremock/wiremock-standalone
wiremock = "3.13.2"

#
# Plugins
#

# Latest version -> https://github.com/checkstyle/checkstyle/releases/
# Stay aligned with codacy version (log in into codacy and go to the "code patterns" menu)
# 12.x is the latest supporting java 17 (13+ requires java 21)
checkstyle = "12.3.1"

# Latest version -> https://pmd.github.io
# Stay aligned with codacy version (log in into codacy and go to the "code patterns" menu)
pmd = "6.55.0"     # Stay aligned with Codacy

# Coveralls plugin
# Latest version -> https://plugins.gradle.org/plugin/com.github.kt3k.coveralls
coveralls = "2.12.2"

# Spotless plugin
# Latest version -> https://plugins.gradle.org/plugin/com.diffplug.gradle.spotless
spotless = "8.10.3"

# Google Java Format, used by Spotless
# Latest version -> https://github.com/google/google-java-format/releases
# Spotless limits google-java-format to 1.28.0 when running on java 17
google-java-format = "1.28.0"

# Maven publish plugin
# Latest version -> https://github.com/vanniktech/gradle-maven-publish-plugin/releases
maven-publish = "0.37.0"

# OWASP Dependency Check plugin
# Latest version -> https://plugins.gradle.org/plugin/org.owasp.dependencycheck
dependency-check = "13.0.0"

[libraries]

# Core
checker-qual = { module = "org.checkerframework:checker-qual", version.ref = "checker-qual" }

# Apache Commons
commons-cli = { module = "commons-cli:commons-cli", version.ref = "commons-cli" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }

# Spring Boot (BOM)
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# LibreOffice
libreoffice = { module = "org.libreoffice:libreoffice", version.ref = "lo" }

# OpenOffice
oo-juh = { module = "org.openoffice:juh", version.ref = "oo" }
oo-jurt = { module = "org.openoffice:jurt", version.ref = "oo" }
oo-ridl = { module = "org.openoffice:ridl", version.ref = "oo" }
oo-unoil = { module = "org.openoffice:unoil", version.ref = "oo" }

# Spring Core
spring-core = { module = "org.springframework:spring-core", version.ref = "spring" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring" }

# Jakarta (version from the Spring Boot BOM)
jakarta-annotations = { module = "jakarta.annotation:jakarta.annotation-api" }

# HTTP Components
httpcore = { module = "org.apache.httpcomponents:httpcore", version.ref = "httpcore" }
httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpclient" }
httpmime = { module = "org.apache.httpcomponents:httpmime", version.ref = "httpclient" }
fluent-hc = { module = "org.apache.httpcomponents:fluent-hc", version.ref = "httpclient" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commons-codec" }

# Logging
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-log4j = { module = "org.slf4j:slf4j-log4j12", version.ref = "slf4j" }

# Other
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Test
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
# The JUnit artifacts get their version from the JUnit BOM
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-inline = { module = "org.mockito:mockito-inline", version.ref = "mockito" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

# Plugins
spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
maven-publish = { module = "com.vanniktech.maven.publish:com.vanniktech.maven.publish.gradle.plugin", version.ref = "maven-publish" }

[plugins]
# Use in settings.gradle.kts or plugins {} blocks
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
coveralls = { id = "com.github.kt3k.coveralls", version.ref = "coveralls" }
dependency-check = { id = "org.owasp.dependencycheck", version.ref = "dependency-check" }
