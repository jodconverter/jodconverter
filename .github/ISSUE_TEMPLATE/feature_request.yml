name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the use case, not only the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How you would like it to work. Alternatives you considered are welcome too.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to contribute it?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with some guidance"
        - "No"
