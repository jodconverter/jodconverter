name: deploy-docs

# develop publishes the "dev" version of the site; a release pushed to master publishes its version with the
# "latest" alias. The manual run publishes the given release version from the selected branch's docs.
on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish with the "latest" alias (e.g. 4.4.11). Empty: the version in gradle.properties.'
        required: false
        default: ''

# Read-only by default; the job that pushes to gh-pages asks for the write access itself.
permissions:
  contents: read

# mike pushes to gh-pages: one deployment at a time, none cancelled halfway
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # mike commits the site to the gh-pages branch

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Needed for mike history

      - name: 🛂 Configure Git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: 🐍 Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # Pinned versions; mike comes from the Zensical-compatible fork until Zensical supports versioning
      # natively. No cache: Zensical does not recommend caching on CI while its caching is being reworked.
      - name: 📥 Install Zensical and mike
        run: pip install -r requirements-docs.txt

      - name: 🧮 Choose the version to deploy
        id: target
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${INPUT_VERSION:-$(grep "^version\s*=" gradle.properties | cut -d'=' -f2 | tr -d ' ')}"
          if [[ "$version" == *-SNAPSHOT ]]; then
            # Snapshots are published as "dev" from develop only
            if [[ "$REF_NAME" != "develop" ]]; then
              echo "Snapshot version $version on $REF_NAME: nothing to deploy"
              echo "MODE=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "MODE=dev" >> "$GITHUB_OUTPUT"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "MODE=release" >> "$GITHUB_OUTPUT"
            echo "VERSION=$version" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Invalid version: $version"
            exit 1
          fi

      - name: 📤 Deploy documentation with mike
        if: steps.target.outputs.MODE != 'skip'
        env:
          MODE: ${{ steps.target.outputs.MODE }}
          VERSION: ${{ steps.target.outputs.VERSION }}
        run: |
          if [[ "$MODE" == "dev" ]]; then
            echo "Deploying the development documentation as 'dev'"
            mike deploy --push --update-aliases dev
          else
            echo "Deploying version $VERSION with the 'latest' alias"
            mike deploy --push --update-aliases "$VERSION" latest
            mike set-default --push latest
          fi
