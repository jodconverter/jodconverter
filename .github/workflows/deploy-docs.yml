name: deploy-docs

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Needed for mike history

      - name: 🛂 Configure Git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Pinned versions; mike comes from the Zensical-compatible fork until Zensical supports versioning
      # natively. No cache: Zensical does not recommend caching on CI while its caching is being reworked.
      - name: 📥 Install Zensical and mike
        run: pip install -r requirements-docs.txt

      - name: 🧮 Extract version from gradle.properties
        id: extract_version
        run: |
          version=$(grep "^version\s*=" gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "VERSION=$version" >> $GITHUB_OUTPUT
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "IS_SNAPSHOT=true" >> $GITHUB_OUTPUT
          else
            echo "IS_SNAPSHOT=false" >> $GITHUB_OUTPUT
          fi

      - name: 📤 Deploy documentation with mike
        run: |
          version=${{ steps.extract_version.outputs.VERSION }}
          is_snapshot=${{ steps.extract_version.outputs.IS_SNAPSHOT }}

          if [[ "$is_snapshot" == "true" ]]; then
            echo "Deploying SNAPSHOT to static folder 'snapshot'"
            mike deploy --push --update-aliases dev
          else
            echo "Deploying stable version $version with alias 'latest'"
            mike deploy --push --update-aliases "$version" latest
            mike set-default --push latest
          fi