name: build

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

# A new push to the same pull request or branch cancels the run in progress.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Read by the Coveralls step; a step cannot test its own env in its condition, so the job
      # carries it.
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    # A job allowed to fail still runs and reports, but does not fail the "build" check below.
    continue-on-error: ${{ matrix.allow-failure == true }}
    strategy:
      # Let every OS report, so an OS-specific failure is not hidden by another one.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          # On the GitHub Windows runners, LibreOffice 26.2 crashes now and then when it closes a
          # presentation or a drawing it has just stored or exported, a different test on each run
          # (seen on 2026-10-08, and with an unpacked 26.2 on a workstation; the still and fresh
          # packages of Chocolatey are both 26.2.6). It reports but does not block a merge.
          - os: windows-latest
            allow-failure: true
          # macOS 14 on purpose. On the macOS 15 and 26 images (macos-latest), the first reverse
          # lookup of 127.0.0.1 in a process takes 35 s (seven resolver scopes of 5 s each, measured
          # on 2026-10-08 with getnameinfo, on arm64 and Intel), and LibreOffice does that lookup
          # when it accepts a UNO connection: every office start waited 35 s for the answer to its
          # first request. The macOS 14 image answers at once. It reports but does not block a merge.
          - os: macos-14
            allow-failure: true

    steps:
      - name: 🪟 Use CRLF line endings on Windows
        # Spotless expects the platform line endings; without this, spotlessCheck fails on Windows.
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - name: 📦 Checkout repository
        uses: actions/checkout@v7

      - name: ☕ Set up JDK 17
        # Runs Gradle. The code is compiled and tested on the Java version set in
        # gradle/libs.versions.toml, through a Gradle toolchain that is downloaded when missing.
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 📥 Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -q update
          sudo apt-get -y -q install libreoffice

      # Windows and macOS: both package managers download LibreOffice from
      # download.documentfoundation.org. The timeout stops the job early when that host is
      # unreachable, instead of hanging until the job timeout.
      - name: 📥 Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: choco install libreoffice-still -y --no-progress

      - name: 📥 Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: brew install --cask libreoffice

      - name: 🛠️ Build and test
        # bash on every OS, so the same wrapper script runs everywhere.
        # --continue: a failing module does not hide the results of the others.
        shell: bash
        run: ./gradlew build -x javadoc --continue --stacktrace

      - name: 📤 Send the coverage to Coveralls
        # The coveralls-jacoco plugin aggregates the JaCoCo reports of the build above (no test
        # runs again: they are excluded) and sends them with the source paths relative to the
        # repository, so that Coveralls shows the sources of every module. Pull requests and pushes
        # to develop and master; Coveralls lists the branches it receives. Skipped while the
        # COVERALLS_REPO_TOKEN secret is not set.
        if: runner.os == 'Linux' && env.COVERALLS_REPO_TOKEN != ''
        shell: bash
        run: ./gradlew coverallsJacoco -x test -x integrationTest

      - name: 📤 Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # The single check to require in the branch rulesets: it passes only when every OS that is
  # not allowed to fail passed.
  # Rename it only together with the rulesets, or pull requests wait forever for a check
  # that no longer reports.
  build:
    name: build
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ✅ Check the result of every OS
        run: test "${{ needs.test.result }}" = "success"
