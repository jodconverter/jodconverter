name: build

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master
  # The macOS job only, once a week on Monday (see the matrix below).
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      macos:
        description: 'Run the macOS job only, as the weekly run does'
        type: boolean
        default: false

# A new push to the same pull request or branch cancels the run in progress. The macOS runs have
# their own group, so that a push to develop does not cancel them.
concurrency:
  group: build-${{ (github.event_name == 'schedule' || inputs.macos) && 'macos-' || '' }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Read by the Coveralls step; a step cannot test its own env in its condition, so the job
      # carries it.
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    # A job allowed to fail still runs and reports, but does not fail the "build" check below.
    continue-on-error: ${{ matrix.allow-failure == true }}
    strategy:
      # Let every OS report, so an OS-specific failure is not hidden by another one.
      fail-fast: false
      # Pull requests and pushes: Linux and Windows. On the GitHub Windows runners, LibreOffice
      # 26.2 crashes now and then when it closes a presentation or a drawing it has just stored or
      # exported, a different test on each run (seen on 2026-10-08, and with an unpacked 26.2 on a
      # workstation; the still and fresh packages of Chocolatey are both 26.2.6), so Windows
      # reports but does not block a merge.
      #
      # macOS runs once a week only, on its own. LibreOffice looks up the host name of 127.0.0.1
      # when it accepts a UNO connection, and on the macOS 15 and 26 images the first such lookup
      # of a process takes 35 s (seven resolver scopes of 5 s each, through mDNSResponder; neither
      # /etc/hosts, the host name nor a resolver file shortens it): every office start waits that
      # long, and tests exceed their queue timeout. The macOS 14 image, which answered at once,
      # was retired in November 2026; on macos-26, a getnameinfo probe in Python answered at once
      # on 2026-11-09 while the office starts of the same image still took 30 to 39 s, so judge an
      # image by this job, not by the probe. The weekly run turns green once an image no longer
      # waits; macOS can then come back to the pull requests.
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || inputs.macos) && '[{"os":"macos-26"}]' || '[{"os":"ubuntu-latest"},{"os":"windows-latest","allow-failure":true}]') }}

    steps:
      - name: 🪟 Use CRLF line endings on Windows
        # Spotless expects the platform line endings; without this, spotlessCheck fails on Windows.
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - name: 📦 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛡️ Validate the Gradle wrapper
        # gradle/wrapper/gradle-wrapper.jar is the one binary of the repository, and it runs at
        # every build: its checksum must be one that Gradle published. A pull request that replaces
        # it with something else fails here, before the wrapper runs.
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: ☕ Set up JDK 17
        # Runs Gradle. The code is compiled and tested on the Java version set in
        # gradle/libs.versions.toml, through a Gradle toolchain that is downloaded when missing.
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The timeout stops the job early when a download stalls, instead of hanging until the job
      # timeout: the Ubuntu mirror was seen to stop answering in the middle of the packages.
      - name: 📥 Install LibreOffice (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get -q update
          sudo apt-get -y -q install libreoffice
          soffice --version

      # Windows and macOS: both package managers download LibreOffice from
      # download.documentfoundation.org. The timeout stops the job early when that host is
      # unreachable, instead of hanging until the job timeout.
      #
      # Each install step ends by checking that the office is there. Chocolatey in particular
      # exits with success when it cannot reach its package feed ("installed 0/0 packages", seen
      # on 2026-10-12): the job then went on without an office, and every test that needs one
      # failed. The install is tried three times, since such a failure does not last.
      - name: 📥 Install LibreOffice (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $soffice = 'C:\Program Files\LibreOffice\program\soffice.exe'
          foreach ($attempt in 1..3) {
            choco install libreoffice-still -y --no-progress
            if (Test-Path $soffice) { break }
            Write-Host "LibreOffice is not installed after attempt $attempt."
            Start-Sleep -Seconds 20
          }
          if (-not (Test-Path $soffice)) {
            Write-Host '::error::LibreOffice was not installed.'
            exit 1
          }
          Write-Host "Installed: $soffice"
          # The office is there: an exit code of the package manager that asks for a restart, for
          # example, must not fail the step.
          exit 0

      - name: 📥 Install LibreOffice (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          brew install --cask libreoffice
          test -x /Applications/LibreOffice.app/Contents/MacOS/soffice

      - name: 🛠️ Build and test
        # bash on every OS, so the same wrapper script runs everywhere.
        # --continue: a failing module does not hide the results of the others.
        shell: bash
        run: ./gradlew build -x javadoc --continue --stacktrace

      - name: 📤 Send the coverage to Coveralls
        # The coveralls-jacoco plugin aggregates the JaCoCo reports of the build above (no test
        # runs again: they are excluded) and sends them with the source paths relative to the
        # repository, so that Coveralls shows the sources of every module. Pull requests and pushes
        # to develop and master; Coveralls lists the branches it receives. Skipped while the
        # COVERALLS_REPO_TOKEN secret is not set.
        # A failure here does not fail the job: the code is built and tested by then, and an upload
        # that times out (seen on 2026-10-12) must not block a merge. The step is then shown with
        # a warning, and the coverage of that run is missing on Coveralls.
        if: runner.os == 'Linux' && env.COVERALLS_REPO_TOKEN != ''
        continue-on-error: true
        shell: bash
        run: ./gradlew coverallsJacoco -x test -x integrationTest

      - name: 📤 Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # The local module is built and tested above with the office libraries of OpenOffice, its
  # default (see jodconverter-local/build.gradle.kts), while applications use those of LibreOffice
  # through jodconverter-local-lo. The two do not behave the same: an exception that is checked in
  # the first is a runtime exception in the second, and the first do not know the newer types the
  # office sends, which ends the connection instead of reaching the code. A bug of version 5.1.0
  # (a wrong password that was not reported as such) lived in that gap. This job runs the tests
  # of the local module with the libraries that applications use.
  test-libreoffice-libraries:
    name: test (LibreOffice libraries)
    if: github.event_name != 'schedule' && !inputs.macos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🛡️ Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: 📥 Install LibreOffice
        timeout-minutes: 10
        run: |
          sudo apt-get -q update
          sudo apt-get -y -q install libreoffice
          soffice --version

      - name: 🛠️ Test the local module with the LibreOffice libraries
        run: ./gradlew :jodconverter-local:test :jodconverter-local:integrationTest -PuseLibreOffice --continue --stacktrace

      - name: 📤 Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-libreoffice-libraries
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  # The single check to require in the branch rulesets: it passes only when every OS that is
  # not allowed to fail passed, and the tests with the LibreOffice libraries too.
  # Rename it only together with the rulesets, or pull requests wait forever for a check
  # that no longer reports. Not part of the weekly macOS run, whose result is that of its job.
  build:
    name: build
    if: always() && github.event_name != 'schedule' && !inputs.macos
    needs: [test, test-libreoffice-libraries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ✅ Check the result of every OS and of the LibreOffice libraries
        run: |
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.test-libreoffice-libraries.result }}" = "success"
