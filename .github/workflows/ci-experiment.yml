name: ci-experiment

# Temporary: experiments on the Windows and macOS runners, to understand why the build matrix
# entries of these systems are disabled (see build.yml). Runs on every push of its branch.
on:
  push:
    branches:
      - ci/experiments

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: The lookups of the Java UNO connection, before and after each remedy
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 1
          cat /etc/hosts | grep -v '^#'
          java .github/experiments/Lookups.java "as the runner comes ($(hostname))" 8765
          java .github/experiments/Lookups.java "again, same JVM settings" 8765
          sudo scutil --set HostName ci-runner
          echo "127.0.0.1 ci-runner" | sudo tee -a /etc/hosts > /dev/null
          echo "::1 ci-runner" | sudo tee -a /etc/hosts > /dev/null
          java .github/experiments/Lookups.java "with the host name ci-runner in /etc/hosts ($(hostname))" 8765
          java -Djava.net.preferIPv4Stack=true .github/experiments/Lookups.java "the same, with preferIPv4Stack" 8765
          sudo sed -i '' '/ci-runner/d' /etc/hosts
          java .github/experiments/Lookups.java "host name ci-runner, not in /etc/hosts" 8765
          sudo scutil --set HostName localhost
          java .github/experiments/Lookups.java "with the host name localhost ($(hostname))" 8765
