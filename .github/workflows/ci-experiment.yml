name: ci-experiment

# Temporary: experiments on the Windows and macOS runners, to understand why the build matrix
# entries of these systems are disabled (see build.yml). Runs on every push of its branch.
on:
  push:
    branches:
      - ci/experiments

permissions:
  contents: read

jobs:
  macos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel, macos-26, macos-latest]
    steps:
      - name: Reverse lookup of 127.0.0.1 on this image
        run: |
          sw_vers | tr '\n' ' '; echo; uname -m
          python3 - <<'PY'
          import socket, time
          for i in range(2):
              start = time.time()
              name = socket.getnameinfo(("127.0.0.1", 0), 0)[0]
              print(f"127.0.0.1 -> {name} in {round(time.time() - start, 1)} s", flush=True)
          PY
