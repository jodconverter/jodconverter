name: ci-experiment

# Temporary: experiments on the Windows and macOS runners, to understand why the build matrix
# entries of these systems are disabled (see build.yml). Runs on every push of its branch.
on:
  push:
    branches:
      - ci/experiments

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Remedies for the slow resolution of the host name
        run: |
          measure() {
            python3 - "$1" <<'PY'
          import socket, sys, time
          start = time.time()
          try:
              infos = sorted({i[4][0] for i in socket.getaddrinfo(socket.gethostname(), None)})
          except Exception as ex:
              infos = repr(ex)
          print(f"{sys.argv[1]}: {round(time.time() - start, 1)} s -> {infos}")
          PY
          }
          name=$(hostname)
          echo "host name: $name"
          measure "as the runner comes"
          echo "::1 $name" | sudo tee -a /etc/hosts > /dev/null
          measure "with an IPv6 line in /etc/hosts"
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
          measure "after flushing the caches"
          sudo scutil --set HostName ci-runner
          echo "127.0.0.1 ci-runner" | sudo tee -a /etc/hosts > /dev/null
          echo "::1 ci-runner" | sudo tee -a /etc/hosts > /dev/null
          echo "host name now: $(hostname)"
          measure "with a host name outside .local"
